<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Básica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            padding-top: 40px;
        }

        .pokedex {
            background-color: #e74c3c;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            width: 300px;
            text-align: center;
            color: white;
        }

        .search-box {
            margin-bottom: 15px;
        }

        input {
            padding: 8px;
            border: none;
            border-radius: 5px;
            width: 60%;
        }

        button {
            padding: 8px 12px;
            border: none;
            background-color: #2c3e50;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .screen {
            background-color: #ecf0f1;
            color: #333;
            border-radius: 10px;
            padding: 15px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .screen img {
            width: 120px;
            height: 120px;
        }

        .error {
            color: #c0392b;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="pokedex">
        <h2>Mini Pokédex</h2>

        <div class="search-box">
            <input type="text" id="pokemonInput" placeholder="Nombre o ID...">
            <button onclick="buscarPokemon()">Buscar</button>
        </div>

        <div class="screen" id="pantalla">
            <p>Escribe el nombre o número de un Pokémon para consultar la PokeAPI.</p>
        </div>
    </div>

    <script>
        async function buscarPokemon() {
            const input = document.getElementById('pokemonInput').value.toLowerCase().trim();
            const pantalla = document.getElementById('pantalla');

            if (!input) {
                pantalla.innerHTML = '<p class="error">Por favor ingresa un nombre o número.</p>';
                return;
            }

            pantalla.innerHTML = '<p>Cargando...</p>';

            try {
                const respuesta = await fetch(`https://pokeapi.co/api/v2/pokemon/${input}`);

                if (!respuesta.ok) {
                    throw new Error('Pokémon no encontrado');
                }

                const data = await respuesta.json();
                // Imprime también en la consola del navegador (F12)
                console.log('Objeto JSON completo de PokéAPI:', data);

                // Extracción de datos
                const nombre = data.name.toUpperCase();
                const id = data.id;
                const imagen = data.sprites.front_default;
                const tipos = data.types.map(t => t.type.name).join(', ');
                const altura = data.height / 10; // Decímetros a metros
                const peso = data.weight / 10;   // Hectogramos a kilos

                // Renderizado en HTML
                pantalla.innerHTML = `
          <h3>#${id} ${nombre}</h3>
          <img src="${imagen}" alt="${nombre}">
          <p><strong>Tipo:</strong> ${tipos}</p>
          <p><strong>Altura:</strong> ${altura} m</p>
          <p><strong>Peso:</strong> ${peso} kg</p>
        `;

            } catch (error) {
                pantalla.innerHTML = `<p class="error">${error.message}</p>`;
            }
        }
    </script>

</body>

</html>
